name: Compile Nova Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'nova-client/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('nova-client/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      # Install all dependencies manually
      - name: Install LWJGL 2.9.4
        run: |
          mkdir -p ~/.m2/repository/org/lwjgl/lwjgl/2.9.4
          
          # Download LWJGL core
          wget -q -O ~/.m2/repository/org/lwjgl/lwjgl/2.9.4/lwjgl-2.9.4.jar \
            https://build.lwjgl.org/release/lwjgl/2.9.4/lwjgl-2.9.4.jar || true
          
          # Download LWJGL util
          wget -q -O ~/.m2/repository/org/lwjgl/lwjgl/2.9.4/lwjgl_util-2.9.4.jar \
            https://build.lwjgl.org/release/lwjgl/2.9.4/lwjgl_util-2.9.4.jar || true
          
          # Install LWJGL to local Maven repo
          mvn install:install-file -q \
            -Dfile=~/.m2/repository/org/lwjgl/lwjgl/2.9.4/lwjgl-2.9.4.jar \
            -DgroupId=org.lwjgl.lwjgl \
            -DartifactId=lwjgl \
            -Dversion=2.9.4 \
            -Dpackaging=jar || true
          
          mvn install:install-file -q \
            -Dfile=~/.m2/repository/org/lwjgl/lwjgl/2.9.4/lwjgl_util-2.9.4.jar \
            -DgroupId=org.lwjgl.lwjgl \
            -DartifactId=lwjgl_util \
            -Dversion=2.9.4 \
            -Dpackaging=jar || true
      
      - name: Install GSON 2.8.9
        run: |
          mkdir -p ~/.m2/repository/com/google/code/gson/2.8.9
          
          wget -q -O ~/.m2/repository/com/google/code/gson/2.8.9/gson-2.8.9.jar \
            https://repo1.maven.org/maven2/com/google/code/gson/gson/2.8.9/gson-2.8.9.jar || true
          
          mvn install:install-file -q \
            -Dfile=~/.m2/repository/com/google/code/gson/2.8.9/gson-2.8.9.jar \
            -DgroupId=com.google.code.gson \
            -DartifactId=gson \
            -Dversion=2.8.9 \
            -Dpackaging=jar || true
      
      - name: Install Mixins 0.8.5
        run: |
          mkdir -p ~/.m2/repository/org/spongepowered/mixin/0.8.5
          
          wget -q -O ~/.m2/repository/org/spongepowered/mixin/0.8.5/mixin-0.8.5.jar \
            https://repo.spongepowered.org/repository/maven-public/org/spongepowered/mixin/0.8.5/mixin-0.8.5.jar || true
          
          mvn install:install-file -q \
            -Dfile=~/.m2/repository/org/spongepowered/mixin/0.8.5/mixin-0.8.5.jar \
            -DgroupId=org.spongepowered \
            -DartifactId=mixin \
            -Dversion=0.8.5 \
            -Dpackaging=jar || true
      
      - name: Install Minecraft 1.8.9
        run: |
          mkdir -p ~/.m2/repository/com/mojang/minecraft/1.8.9
          
          wget -q -O ~/.m2/repository/com/mojang/minecraft/1.8.9/minecraft-1.8.9-client.jar \
            https://libraries.minecraft.net/com/mojang/minecraft/1.8.9/minecraft-1.8.9-client.jar || true
          
          mvn install:install-file -q \
            -Dfile=~/.m2/repository/com/mojang/minecraft/1.8.9/minecraft-1.8.9-client.jar \
            -DgroupId=com.mojang \
            -DartifactId=minecraft \
            -Dversion=1.8.9 \
            -Dpackaging=jar || true
      
      - name: Build with Maven (skip Minecraft dependency)
        run: cd nova-client && mvn clean compile -DskipMinecraft=true
        
      - name: Package JAR (skip Minecraft dependency)
        run: cd nova-client && mvn package -DskipTests -DskipMinecraft=true
        
      - name: List target contents
        run: ls -la nova-client/target/ || true
        
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nova-client-core-jar
          path: nova-client/target/*.jar
          retention-days: 30
