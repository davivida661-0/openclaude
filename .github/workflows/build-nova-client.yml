name: Build Nova Client

on:
  push:
    branches: [ main ]
    paths:
      - 'nova-client/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'nova-client/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('nova-client/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      # Install Minecraft 1.8.9 to local Maven repository
      - name: Install Minecraft 1.8.9
        run: |
          mkdir -p ~/.m2/repository/com/mojang/minecraft/1.8.9
          
          # Download Minecraft 1.8.9 client JAR
          wget -q -O /tmp/minecraft-1.8.9.jar \
            https://launcher.mojang.com/v1/objects/725239f57282c2258c85d24515583d4154641661d478f56d876495343679484/minecraft-1.8.9-client.jar
          
          # Install to local Maven repo
          mvn install:install-file \
            -Dfile=/tmp/minecraft-1.8.9.jar \
            -DgroupId=com.mojang \
            -DartifactId=minecraft \
            -Dversion=1.8.9 \
            -Dpackaging=jar \
            -DgeneratePom=true
      
      - name: Build with Maven
        run: cd nova-client && mvn clean compile
        
      - name: Package JAR
        run: cd nova-client && mvn package -DskipTests
        
      - name: List target contents
        run: ls -la nova-client/target/ || true
        
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: nova-client-jar
          path: nova-client/target/*.jar
          retention-days: 30
          
      - name: Create Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: nova-client/target/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
