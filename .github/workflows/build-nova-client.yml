name: Build Nova Client

on:
  push:
    branches: [ main ]
    paths:
      - 'nova-client/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'nova-client/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('nova-client/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Build with Maven
        run: cd nova-client && mvn clean compile
        
      - name: Run tests
        run: cd nova-client && mvn test
        continue-on-error: true
        
      - name: Package JAR
        run: cd nova-client && mvn package -DskipTests
        
      - name: List target directory
        run: ls -la nova-client/target/
        
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v3
        with:
          name: nova-client-jar
          path: nova-client/target/*.jar
          retention-days: 30
          
      - name: Create Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: nova-client/target/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
