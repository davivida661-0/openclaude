name: Build Nova Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'nova-client/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'nova-client/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Install Minecraft 1.8.9
        run: |
          set -e
          cd /tmp
          wget -q -O minecraft-1.8.9-client.jar https://launcher.mojang.com/v1/objects/725239f57282c2258c85d24515583d4154641661d478f56d876495343679484/minecraft-1.8.9-client.jar
          if [ ! -f minecraft-1.8.9-client.jar ]; then
            echo "::error::Failed to download Minecraft 1.8.9"
            exit 1
          fi
          mvn install:install-file \
            -Dfile=minecraft-1.8.9-client.jar \
            -DgroupId=com.mojang \
            -DartifactId=minecraft \
            -Dversion=1.8.9 \
            -Dpackaging=jar \
            -DgeneratePom=true
      
      - name: Build with Maven
        run: cd nova-client && mvn clean package -DskipTests
        
      - name: List target contents
        run: ls -la nova-client/target/ || true
        
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nova-client-jar
          path: nova-client/target/*.jar
          retention-days: 30
